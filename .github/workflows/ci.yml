name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: shopflow
          POSTGRES_PASSWORD: shopflow_dev
          POSTGRES_DB: shopflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DATABASE_URL: postgresql://shopflow:shopflow_dev@localhost:5432/shopflow_test

      - name: Run database migrations
        run: cd packages/prisma && npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://shopflow:shopflow_dev@localhost:5432/shopflow_test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://shopflow:shopflow_dev@localhost:5432/shopflow_test
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: test_access_secret
          JWT_REFRESH_SECRET: test_refresh_secret

  build-docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push images
        run: |
          for service in api-gateway auth-service product-service order-service payment-service notification-service; do
            docker build -f apps/$service/Dockerfile \
              -t ${{ steps.login-ecr.outputs.registry }}/shopflow-$service:${{ github.sha }} \
              -t ${{ steps.login-ecr.outputs.registry }}/shopflow-$service:latest .
            docker push ${{ steps.login-ecr.outputs.registry }}/shopflow-$service:${{ github.sha }}
            docker push ${{ steps.login-ecr.outputs.registry }}/shopflow-$service:latest
          done
